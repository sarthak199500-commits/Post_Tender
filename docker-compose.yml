services:
  gateway:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /app/src/Backend/PostTenderSystem.Gateway
    volumes:
      - .:/app
    command: dotnet run
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ReverseProxy__Clusters__identity-cluster__Destinations__identity-destination__Address=http://identity-service:8080
      - ReverseProxy__Clusters__vendor-cluster__Destinations__vendor-destination__Address=http://vendor-service:8080
      - ReverseProxy__Clusters__tender-cluster__Destinations__tender-destination__Address=http://tender-service:8080
      - ReverseProxy__Clusters__execution-cluster__Destinations__execution-destination__Address=http://execution-service:8080
      - ReverseProxy__Clusters__inspection-cluster__Destinations__inspection-destination__Address=http://inspection-service:8080
      - ReverseProxy__Clusters__financial-cluster__Destinations__financial-destination__Address=http://financial-service:8080
      - ReverseProxy__Clusters__common-cluster__Destinations__common-destination__Address=http://common-service:8080
    ports:
      - "5249:8080"
    depends_on:
      - identity-service
      - vendor-service
      - tender-service
      - execution-service
      - inspection-service
      - financial-service
      - common-service

  identity-service:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /app/src/Backend/Services/IdentityService
    volumes:
      - .:/app
    command: dotnet run
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "5001:8080"

  vendor-service:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /app/src/Backend/Services/VendorService
    volumes:
      - .:/app
    command: dotnet run
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "5002:8080"

  tender-service:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /app/src/Backend/Services/TenderService
    volumes:
      - .:/app
    command: dotnet run
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "5003:8080"

  execution-service:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /app/src/Backend/Services/ExecutionService
    volumes:
      - .:/app
    command: dotnet run
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "5004:8080"

  inspection-service:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /app/src/Backend/Services/InspectionService
    volumes:
      - .:/app
    command: dotnet run
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "5005:8080"

  financial-service:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /app/src/Backend/Services/FinancialService
    volumes:
      - .:/app
    command: dotnet run
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "5006:8080"

  common-service:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /app/src/Backend/Services/CommonService
    volumes:
      - .:/app
    command: dotnet run
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "5007:8080"

  frontend:
    image: node:20
    working_dir: /app/src/Frontend
    volumes:
      - .:/app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
