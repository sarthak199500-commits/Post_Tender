<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Post-Tender Management System</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,sans-serif;background:#f1f5f9;color:#1e293b;display:flex;height:100vh;overflow:hidden}
svg{display:block}

/* SIDEBAR */
.sidebar{width:194px;min-width:194px;background:#0f1e36;height:100vh;display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:none}
.sidebar::-webkit-scrollbar{display:none}
.sb-logo{padding:14px 14px 13px;border-bottom:1px solid rgba(255,255,255,0.07);display:flex;align-items:center;gap:10px;flex-shrink:0;cursor:pointer}
.sb-logo-icon{width:36px;height:36px;background:linear-gradient(140deg,#1e3a8a,#1d4ed8);border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 10px rgba(29,78,216,0.45)}
.sb-logo-text{font-size:8.5px;font-weight:800;color:rgba(255,255,255,0.9);letter-spacing:.07em;line-height:1.45;text-transform:uppercase}
.sb-nav{padding:8px 0;flex:1}
.nav-item{display:flex;align-items:center;justify-content:space-between;padding:8px 15px;cursor:pointer;color:rgba(255,255,255,.52);font-size:12px;font-weight:500;transition:background .13s,color .13s;user-select:none;gap:8px}
.nav-item:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.85)}
.nav-item.active{background:#1d4ed8;color:#fff}
.nav-l{display:flex;align-items:center;gap:9px}
.nav-ic{width:16px;height:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nav-chevron{opacity:.38;flex-shrink:0}
.sb-qa{border-top:1px solid rgba(255,255,255,.07);padding:10px 0;flex-shrink:0}
.qa-hdr{font-size:8.5px;font-weight:700;color:rgba(255,255,255,.28);letter-spacing:.13em;text-transform:uppercase;padding:0 15px 8px}
.qa-item{display:flex;align-items:center;justify-content:space-between;padding:7px 15px;cursor:pointer;color:rgba(255,255,255,.52);font-size:11.5px;font-weight:500;transition:background .13s,color .13s}
.qa-item:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.85)}
.qa-l{display:flex;align-items:center;gap:8px}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{background:#fff;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e2e8f0;flex-shrink:0;gap:14px}
.pg-meta h1{font-size:19px;font-weight:800;color:#0f172a;letter-spacing:-.025em}
.pg-meta p{font-size:11.5px;color:#64748b;margin-top:1px}
.top-ctrls{display:flex;align-items:center;gap:9px}
.ctrl-btn{display:flex;align-items:center;gap:6px;padding:7px 11px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;font-size:11.5px;font-weight:500;color:#374151;cursor:pointer;white-space:nowrap;font-family:inherit;transition:border-color .15s}
.ctrl-btn:hover{border-color:#94a3b8}
.notif-wrap{position:relative}
.notif-btn{width:34px;height:34px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#64748b}
.notif-badge{position:absolute;top:-5px;right:-5px;background:#ef4444;color:#fff;font-size:8.5px;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff}
.user-block{display:flex;align-items:center;gap:9px;padding:5px 10px 5px 5px;border:1px solid #e2e8f0;border-radius:8px;cursor:pointer;background:#fff}
.user-av{width:28px;height:28px;border-radius:6px;background:#1d4ed8;color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.user-nm{font-size:11.5px;font-weight:700;color:#0f172a;line-height:1.1}
.user-rl{font-size:10px;color:#64748b}

/* SCROLL AREA */
#page-content{flex:1;overflow-y:auto;padding:16px 22px;display:flex;flex-direction:column;gap:14px}
#page-content::-webkit-scrollbar{width:5px}
#page-content::-webkit-scrollbar-thumb{background:#c8d4e0;border-radius:3px}

/* SHARED CARD STYLES */
.card{background:#fff;border-radius:12px;border:1px solid #f1f5f9;box-shadow:0 1px 3px rgba(15,30,54,.06)}
.card-pad{padding:16px 18px}

/* KPI GRIDS */
.kpi-row{display:grid;gap:12px}
.kpi-6{grid-template-columns:repeat(6,1fr)}
.kpi-4{grid-template-columns:repeat(4,1fr)}
.kpi-3{grid-template-columns:repeat(3,1fr)}
.kpi-5{grid-template-columns:repeat(5,1fr)}
.kpi-card{background:#fff;border-radius:12px;padding:14px 16px;border:1px solid #f1f5f9;box-shadow:0 1px 3px rgba(15,30,54,.06)}
.kpi-top{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.kpi-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kpi-lbl{font-size:10.5px;font-weight:500;color:#64748b;line-height:1.3}
.kpi-val{font-size:23px;font-weight:800;color:#0f172a;letter-spacing:-.03em;line-height:1;margin-bottom:7px}
.kpi-trend{display:flex;align-items:center;gap:3px;font-size:10.5px;font-weight:600}
.t-up{color:#16a34a}.t-dn{color:#dc2626}.t-mute{color:#94a3b8;font-weight:400}

/* CHARTS */
.charts-row{display:grid;grid-template-columns:310px 1fr 258px;gap:12px}
.chart-card{background:#fff;border-radius:12px;padding:16px 18px;border:1px solid #f1f5f9;box-shadow:0 1px 3px rgba(15,30,54,.06)}
.c-title{font-size:13px;font-weight:700;color:#0f172a;margin-bottom:13px}
.donut-body{display:flex;align-items:center;gap:14px}
.donut-wrap{position:relative;width:138px;height:138px;flex-shrink:0}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.dc-num{font-size:19px;font-weight:800;color:#0f172a;line-height:1}
.dc-lbl{font-size:9px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.donut-legend{flex:1}
.leg-row{display:flex;align-items:center;justify-content:space-between;padding:3.5px 0}
.leg-l{display:flex;align-items:center;gap:6px;font-size:11px;color:#374151;font-weight:500}
.leg-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.leg-r{font-size:10.5px;color:#64748b;font-weight:500}
.lc-legend{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.lc-item{display:flex;align-items:center;gap:6px;font-size:11px;color:#374151;font-weight:500}
.lc-line{width:22px;height:2.5px;border-radius:2px}
.dept-rows{display:flex;flex-direction:column;gap:9px}
.dept-row-item{display:flex;align-items:center;gap:8px}
.dept-nm{font-size:9.5px;color:#374151;font-weight:500;text-align:right;flex-shrink:0;width:96px;line-height:1.3}
.dept-track{flex:1;height:10px;background:#f1f5f9;border-radius:4px;overflow:hidden}
.dept-fill{height:100%;background:linear-gradient(90deg,#60a5fa,#1d4ed8);border-radius:4px}
.dept-val{font-size:10.5px;font-weight:700;color:#1e293b;width:26px;text-align:right;flex-shrink:0}
.c-link{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:#1d4ed8;font-weight:600;margin-top:12px;cursor:pointer}
.c-link:hover{text-decoration:underline}

/* TABLE */
.tbl-card{background:#fff;border-radius:12px;border:1px solid #f1f5f9;box-shadow:0 1px 3px rgba(15,30,54,.06);overflow:hidden}
.tbl-hdr{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid #f1f5f9;gap:12px;flex-wrap:wrap}
.tbl-title{font-size:13px;font-weight:700;color:#0f172a}
.tbl-va{display:flex;align-items:center;gap:3px;font-size:12px;color:#1d4ed8;font-weight:600;cursor:pointer;margin-left:auto}
table{width:100%;border-collapse:collapse}
thead th{font-size:10px;font-weight:600;color:#94a3b8;text-align:left;padding:8px 14px;background:#f8fafc;border-bottom:1px solid #e2e8f0;white-space:nowrap;text-transform:uppercase;letter-spacing:.05em}
tbody td{font-size:11.5px;color:#374151;padding:10px 14px;border-bottom:1px solid #f8fafc;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#fafbfc}
.td-id{font-weight:700;color:#1e293b;font-size:11px}
.td-wo{font-size:11px;color:#64748b}
.td-proj{font-weight:500;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.td-val{font-weight:700;color:#1e293b}
.td-date{color:#64748b}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:700;white-space:nowrap}
.b-ip{background:#dbeafe;color:#1d4ed8}
.b-cp{background:#dcfce7;color:#15803d}
.b-oh{background:#ffedd5;color:#c2410c}
.b-od{background:#fee2e2;color:#dc2626}
.b-dr{background:#f1f5f9;color:#64748b}
.b-hi{background:#fef3c7;color:#92400e}
.b-md{background:#dbeafe;color:#1e40af}
.b-lo{background:#f0fdf4;color:#15803d}
.b-cr{background:#fee2e2;color:#b91c1c}
.b-open{background:#ede9fe;color:#7c3aed}

/* PROGRESS */
.prog-cell{display:flex;align-items:center;gap:8px}
.prog-bar{width:80px;height:5px;background:#e2e8f0;border-radius:3px;overflow:hidden;flex-shrink:0}
.prog-fill{height:100%;border-radius:3px}
.pf-blue{background:#3b82f6}.pf-green{background:#22c55e}.pf-orange{background:#f97316}.pf-red{background:#ef4444}.pf-gray{background:#94a3b8}
.prog-pct{font-size:11px;font-weight:700;color:#475569;width:32px}

/* ACTION BUTTONS */
.action-eye{width:28px;height:28px;border-radius:6px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#64748b;transition:background .15s,color .15s}
.action-eye:hover{background:#dbeafe;color:#1d4ed8}

/* BOTTOM METRICS */
.bot-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.bot-card{background:#fff;border-radius:12px;padding:14px 15px;border:1px solid #f1f5f9;box-shadow:0 1px 3px rgba(15,30,54,.06);display:flex;align-items:center;gap:13px}
.bot-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bot-meta{flex:1;min-width:0}
.bot-lbl{font-size:10.5px;color:#64748b;font-weight:500;margin-bottom:3px}
.bot-val{font-size:19px;font-weight:800;color:#0f172a;letter-spacing:-.02em;line-height:1;margin-bottom:5px}
.bot-trend{display:flex;align-items:center;gap:3px;font-size:10px;font-weight:600}

/* FILTER BAR */
.filter-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filter-tab{padding:5px 12px;border-radius:20px;font-size:11.5px;font-weight:600;cursor:pointer;border:1px solid #e2e8f0;background:#fff;color:#64748b;transition:all .15s}
.filter-tab:hover{border-color:#1d4ed8;color:#1d4ed8}
.filter-tab.active{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
.search-input{padding:7px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:12px;color:#374151;outline:none;font-family:inherit;margin-left:auto;width:200px}
.search-input:focus{border-color:#3b82f6}

/* PAGE-SPECIFIC */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.project-card{background:#fff;border-radius:12px;padding:16px;border:1px solid #f1f5f9;box-shadow:0 1px 3px rgba(15,30,54,.06)}
.project-card-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.project-name{font-size:13px;font-weight:700;color:#0f172a;margin-bottom:3px}
.project-dept{font-size:11px;color:#64748b}
.project-progress-label{display:flex;justify-content:space-between;margin-bottom:5px}
.project-prog-bar{width:100%;height:6px;background:#e2e8f0;border-radius:4px;overflow:hidden;margin-bottom:8px}
.project-meta{display:flex;gap:12px;font-size:10.5px;color:#64748b}

/* ALERT CARD */
.alert-item{display:flex;align-items:flex-start;gap:12px;padding:14px 18px;border-bottom:1px solid #f8fafc;cursor:pointer;transition:background .15s}
.alert-item:hover{background:#f8fafc}
.alert-item:last-child{border-bottom:none}
.alert-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}
.alert-content{flex:1}
.alert-title{font-size:12.5px;font-weight:600;color:#1e293b;margin-bottom:3px}
.alert-desc{font-size:11.5px;color:#64748b}
.alert-time{font-size:10px;color:#94a3b8;margin-top:4px}
.alert-unread{background:#eff6ff}

/* REPORT TILE */
.report-tile{background:#fff;border-radius:12px;padding:18px;border:1px solid #f1f5f9;box-shadow:0 1px 3px rgba(15,30,54,.06);display:flex;flex-direction:column;gap:10px}
.report-tile-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.report-tile-title{font-size:13px;font-weight:700;color:#0f172a}
.report-tile-desc{font-size:11px;color:#64748b;line-height:1.5}
.download-btn{display:flex;align-items:center;gap:6px;padding:7px 12px;background:#eff6ff;color:#1d4ed8;border-radius:8px;font-size:11.5px;font-weight:600;cursor:pointer;margin-top:auto;width:fit-content;transition:background .15s}
.download-btn:hover{background:#dbeafe}

/* VENDOR SCORE */
.score-bar-wrap{display:flex;align-items:center;gap:8px}
.score-bar{flex:1;height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden}
.score-fill{height:100%;border-radius:3px}

/* SETTINGS */
.settings-section{background:#fff;border-radius:12px;padding:20px;border:1px solid #f1f5f9;box-shadow:0 1px 3px rgba(15,30,54,.06)}
.settings-section-title{font-size:14px;font-weight:700;color:#0f172a;margin-bottom:4px}
.settings-section-desc{font-size:11.5px;color:#64748b;margin-bottom:16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-label{font-size:11.5px;font-weight:600;color:#374151}
.form-input{padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:12px;color:#374151;outline:none;font-family:inherit;transition:border-color .15s}
.form-input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.form-select{padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:12px;color:#374151;outline:none;font-family:inherit;background:#fff}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f8fafc}
.toggle-row:last-child{border-bottom:none}
.toggle-info{font-size:12px;color:#374151;font-weight:500}
.toggle-info small{display:block;font-size:10.5px;color:#94a3b8;margin-top:1px;font-weight:400}
.toggle{width:36px;height:20px;background:#e2e8f0;border-radius:10px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle.on{background:#1d4ed8}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;background:#fff;border-radius:50%;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on::after{left:19px}
.save-btn{padding:9px 20px;background:#1d4ed8;color:#fff;border:none;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s}
.save-btn:hover{background:#1e40af}
.section-divider{height:1px;background:#f1f5f9;margin:4px 0}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sb-logo" onclick="App.go('dashboard')">
    <div class="sb-logo-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 2.5 4 6.25V12c0 4.97 3.42 9.62 8 10.75C16.58 21.62 20 16.97 20 12V6.25L12 2.5z" fill="rgba(255,255,255,0.88)"/><path d="M9 12l2.2 2.2 3.8-3.8" stroke="#1e3a8a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="sb-logo-text">POST TENDER<br>MANAGEMENT<br>SYSTEM</div>
  </div>
  <nav class="sb-nav" id="sb-nav">
    <div class="nav-item active" data-page="dashboard" onclick="App.go('dashboard')">
      <div class="nav-l"><div class="nav-ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg></div>Dashboard</div>
    </div>
    <div class="nav-item" data-page="work-orders" onclick="App.go('work-orders')">
      <div class="nav-l"><div class="nav-ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M9 9h6M9 13h6M9 17h4"/></svg></div>Work Orders</div>
      <svg class="nav-chevron" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>

    <div class="nav-item" data-page="tenders" onclick="App.go('tenders')">
      <div class="nav-l"><div class="nav-ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="12" y2="17"/></svg></div>Tenders</div>
      <svg class="nav-chevron" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
    </div>
    <div class="nav-item" data-page="execution" onclick="App.go('execution')">
      <div class="nav-l"><div class="nav-ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>Execution</div>
      <svg class="nav-chevron" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
    </div>
    <div class="nav-item" data-page="inspections" onclick="App.go('inspections')">
      <div class="nav-l"><div class="nav-ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>Inspections</div>
      <svg class="nav-chevron" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
    </div>
    <div class="nav-item" data-page="billing" onclick="App.go('billing')">
      <div class="nav-l"><div class="nav-ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg></div>Billing</div>
      <svg class="nav-chevron" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
    </div>
    <div class="nav-item" data-page="payments" onclick="App.go('payments')">
      <div class="nav-l"><div class="nav-ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>Payments</div>
      <svg class="nav-chevron" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>

const App={
  current:null,
  go(pageId){
    if(!PAGES[pageId])return;
    destroyCharts();
    // Update active nav
    document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
    const navEl=document.querySelector(`[data-page="${pageId}"]`);
    if(navEl)navEl.classList.add('active');
    // Update topbar
    document.getElementById('page-title').textContent=PAGES[pageId].title;
    document.getElementById('page-subtitle').textContent=PAGES[pageId].subtitle;
    // Render content
    document.getElementById('page-content').innerHTML=PAGES[pageId].render();
    document.getElementById('page-content').scrollTop=0;
    this.current=pageId;
    // Init charts after DOM ready
    setTimeout(()=>{
      if(PAGES[pageId].initCharts)PAGES[pageId].initCharts();
    },30);
  }
};

// Work order filter helpers
function filterWO(el,status){
  document.querySelectorAll('.filter-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('#wo-tbody tr').forEach(tr=>{
    if(status==='All'){tr.style.display='';return;}
    const tds=[...tr.querySelectorAll('td')];
    const st=tds[6]?.textContent?.trim()||'';
    tr.style.display=st===status?'':'none';
  });
}
function searchWO(q){
  const lq=q.toLowerCase();
  document.querySelectorAll('#wo-tbody tr').forEach(tr=>{
    tr.style.display=tr.textContent.toLowerCase().includes(lq)?'':'none';
  });
}

// Boot
App.go('dashboard');
</script>
